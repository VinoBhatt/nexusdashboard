name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dry-run deploy (config + build sanity check)
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx wrangler deploy | tee deploy-output.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Post-deploy smoke test
        # Local emulation (wrangler dev --local, vitest-pool-workers) doesn't
        # reproduce every real-runtime constraint - e.g. the PBKDF2 iteration
        # cap that broke login/signup in production while every local/CI
        # check kept passing. Hitting the actual deployed URL closes that gap.
        run: |
          set -eu
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy-output.txt | head -1)
          if [ -z "$URL" ]; then
            echo "Could not determine deployed URL from wrangler output"
            exit 1
          fi
          echo "Smoke testing $URL"
          STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"joshua@cofundr.demo","password":"demopassword"}')
          cat response.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: login returned $STATUS"
            exit 1
          fi
          if ! grep -q '"ok":true' response.json; then
            echo "Smoke test failed: unexpected response body"
            exit 1
          fi
          echo "Smoke test passed"
